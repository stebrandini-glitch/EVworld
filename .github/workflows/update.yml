name: Aggiorna dati e sito
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python collect.py
      - run: python build.py
      - run: |
          git config user.name "ev-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "Aggiornamento dati" && git push)
